<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Мастер-колорист — Документы</title>
    
    <!-- Иконки и шрифты -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        /* ===== ПЕРЕМЕННЫЕ И БАЗОВЫЕ СТИЛИ ===== */
        :root {
            --primary-color: #e8b4b4;
            --primary-dark: #c28b8b;
            --bg-color: #ffffff;
            --bg-color-dark: #1a1a1a;
            --card-bg: #fcf9f7;
            --card-bg-dark: #2a2a2a;
            --text-color: #2d2d2d;
            --text-color-dark: #f5f5f5;
            --text-light: #666666;
            --border-color: #f0e4e0;
            --border-color-dark: #404040;
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            --radius: 20px;
            --tab-inactive: #f0e4e0;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.7;
            transition: all 0.3s ease;
            min-height: 100vh;
        }
        
        body.dark-theme {
            --bg-color: var(--bg-color-dark);
            --card-bg: var(--card-bg-dark);
            --text-color: var(--text-color-dark);
            --text-light: #bbbbbb;
            --border-color: var(--border-color-dark);
            --tab-inactive: #3a3a3a;
        }
        
        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
        }
        
        /* ===== ШАПКА ===== */
        .header {
            text-align: center;
            padding: 30px 0 20px;
            margin-bottom: 20px;
        }
        
        .logo {
            display: inline-flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 15px;
        }
        
        .logo-icon {
            background: linear-gradient(135deg, var(--primary-color), var(--primary-dark));
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .logo-icon i {
            font-size: 28px;
            color: white;
        }
        
        .logo-text {
            font-size: 32px;
            font-weight: 600;
            background: linear-gradient(135deg, var(--primary-dark), #a57878);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .last-updated {
            color: var(--text-light);
            font-size: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 5px;
        }
        
        /* ===== ПЕРЕКЛЮЧАТЕЛЬ ЯЗЫКОВ ===== */
        .language-switcher {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin: 20px 0 25px;
            flex-wrap: wrap;
        }
        
        .lang-btn {
            background: var(--card-bg);
            border: 2px solid var(--border-color);
            border-radius: 50px;
            padding: 10px 25px;
            font-size: 15px;
            font-weight: 500;
            color: var(--text-color);
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .lang-btn i {
            font-size: 16px;
            color: var(--primary-color);
        }
        
        .lang-btn:hover {
            border-color: var(--primary-color);
            transform: translateY(-2px);
        }
        
        .lang-btn.active {
            background: linear-gradient(135deg, var(--primary-color), var(--primary-dark));
            border-color: var(--primary-dark);
            color: white;
        }
        
        .lang-btn.active i {
            color: white;
        }
        
        /* ===== ВКЛАДКИ ===== */
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 5px;
            flex-wrap: wrap;
        }
        
        .tab-btn {
            background: transparent;
            border: none;
            padding: 12px 28px;
            font-size: 17px;
            font-weight: 600;
            color: var(--text-light);
            cursor: pointer;
            border-radius: 40px 40px 0 0;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .tab-btn i {
            font-size: 18px;
        }
        
        .tab-btn.active {
            color: var(--primary-dark);
            background: var(--card-bg);
            border-bottom: 3px solid var(--primary-dark);
        }
        
        .tab-btn:hover:not(.active) {
            color: var(--primary-color);
            background: rgba(232, 180, 180, 0.1);
        }
        
        /* ===== ОСНОВНОЙ КОНТЕНТ ===== */
        .privacy-card {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 40px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
            transition: all 0.2s;
        }
        
        .doc-title {
            font-size: 28px;
            font-weight: 600;
            color: var(--primary-dark);
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid var(--border-color);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .doc-title i {
            font-size: 28px;
        }
        
        .section {
            margin-bottom: 35px;
        }
        
        .section h2 {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 15px;
            color: var(--text-color);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .section h2 i {
            color: var(--primary-color);
            font-size: 18px;
        }
        
        .section p {
            margin-bottom: 15px;
            font-size: 15px;
            color: var(--text-light);
        }
        
        .section ul, .section ol {
            margin: 10px 0 15px 25px;
            color: var(--text-light);
        }
        
        .section li {
            margin-bottom: 8px;
            font-size: 15px;
        }
        
        .highlight-box {
            background: rgba(232, 180, 180, 0.1);
            border-left: 4px solid var(--primary-color);
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
        }
        
        .data-list {
            list-style: none;
            margin-left: 0 !important;
        }
        
        .data-list li {
            padding-left: 25px;
            position: relative;
        }
        
        .data-list li:before {
            content: "✓";
            position: absolute;
            left: 0;
            color: var(--primary-dark);
            font-weight: bold;
        }
        
        .contact-block {
            background: linear-gradient(135deg, rgba(232, 180, 180, 0.1), rgba(194, 139, 139, 0.05));
            border-radius: 15px;
            padding: 25px;
            margin-top: 30px;
            text-align: center;
            border: 1px dashed var(--primary-color);
        }
        
        .contact-email {
            display: inline-block;
            background: white;
            padding: 12px 25px;
            border-radius: 50px;
            color: var(--primary-dark);
            font-weight: 500;
            margin-top: 15px;
            border: 1px solid var(--primary-color);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.05);
        }
        
        body.dark-theme .contact-email {
            background: var(--bg-color-dark);
            color: var(--primary-color);
        }
        
        /* ===== ПОДВАЛ ===== */
        .footer {
            text-align: center;
            padding: 30px 0 20px;
            margin-top: 30px;
            color: var(--text-light);
            font-size: 14px;
            border-top: 1px solid var(--border-color);
        }
        
        /* ===== ПЕРЕКЛЮЧАТЕЛЬ ТЕМЫ ===== */
        .theme-toggle {
            position: fixed;
            bottom: 25px;
            right: 25px;
            background: var(--card-bg);
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
            z-index: 100;
            transition: all 0.3s ease;
        }
        
        .theme-toggle:hover {
            transform: rotate(30deg);
        }
        
        .theme-toggle i {
            font-size: 20px;
            color: var(--text-color);
        }
        
        /* ===== АДАПТИВНОСТЬ ===== */
        @media (max-width: 768px) {
            .privacy-card {
                padding: 25px;
            }
            .doc-title {
                font-size: 24px;
            }
            .logo-text {
                font-size: 26px;
            }
            .logo-icon {
                width: 50px;
                height: 50px;
            }
            .tab-btn {
                padding: 8px 18px;
                font-size: 14px;
            }
        }
        
        @media (max-width: 480px) {
            .container {
                padding: 15px;
            }
            .privacy-card {
                padding: 20px;
            }
            .section h2 {
                font-size: 18px;
            }
            .tabs {
                justify-content: center;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <!-- Переключатель темы -->
    <div class="theme-toggle" id="theme-toggle">
        <i class="fas fa-moon" id="theme-icon"></i>
    </div>

    <!-- Шапка -->
    <header class="header">

            <p data-lang-ru="1.3. Используя Приложение, Пользователь выражает своё согласие с условиями настоящей Политики." data-lang-en="1.3. By using the Application, the User expresses their consent to the terms of this Policy." data-lang-zh="1.3. 使用应用程序即表示用户同意本政策的条款。">1.3. Используя Приложение, Пользователь выражает своё согласие с условиями настоящей Политики.</p></section>

    let currentLang = 'ru';
    let currentTab = 'privacy';

    function updateAllTexts() {
        // обновляем название приложения в шапке и футере
        document.getElementById('app-name-main').innerText = translations.appName[currentLang];
        document.getElementById('app-name-footer').innerText = translations.appName[currentLang];
        
        // обновляем все элементы с data-lang-*
        document.querySelectorAll('[data-lang-ru]').forEach(el => {
            const translation = el.getAttribute(`data-lang-${currentLang}`);
            if (translation) {
                if (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA') el.placeholder = translation;
                else el.innerText = translation;
            }
        });
        
        // дополнительно обновляем заголовки doc-title, которые могут быть в динамическом контенте
        const docTitleSpans = document.querySelectorAll('.doc-title-text');
        if (docTitleSpans.length) {
            const key = currentTab === 'privacy' ? 'privacy' : 'eulaTitle';
            docTitleSpans.forEach(span => {
                span.innerText = translations[key][currentLang];
            });
        }
        
        // обновляем кнопки вкладок (текст)
        const tabPrivacySpan = document.querySelector('.tab-btn[data-tab="privacy"] span');
        const tabEulaSpan = document.querySelector('.tab-btn[data-tab="eula"] span');
        if (tabPrivacySpan) tabPrivacySpan.innerText = currentLang === 'ru' ? 'Политика конфиденциальности' : (currentLang === 'en' ? 'Privacy Policy' : '隐私政策');
        if (tabEulaSpan) tabEulaSpan.innerText = currentLang === 'ru' ? 'Лицензионное соглашение' : (currentLang === 'en' ? 'License Agreement' : '许可协议');
    }

    function renderContent() {
        const container = document.getElementById('doc-content');
        if (currentTab === 'privacy') {
            container.innerHTML = privacyHTML;
        } else {
            container.innerHTML = eulaHTML;
        }
        // после вставки контента обновляем тексты под текущий язык
        updateAllTexts();
    }

    function setLanguage(lang) {
        currentLang = lang;
        // обновляем активные кнопки языка
        document.querySelectorAll('.lang-btn').forEach(btn => {
            if (btn.dataset.lang === lang) btn.classList.add('active');
            else btn.classList.remove('active');
        });
        renderContent(); // перерисовка с новым языком
    }

    function setTab(tab) {
        currentTab = tab;
        document.querySelectorAll('.tab-btn').forEach(btn => {
            if (btn.dataset.tab === tab) btn.classList.add('active');
            else btn.classList.remove('active');
        });
        renderContent();
    }

    // дата
    function setCurrentDate() {
        const now = new Date();
        const months = ['января', 'февраля', 'марта', 'апреля', 'мая', 'июня', 'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря'];
        const dateStr = `${now.getDate()} ${months[now.getMonth()]} ${now.getFullYear()} г.`;
        document.getElementById('current-date').innerText = dateStr;
        document.getElementById('current-year').innerText = now.getFullYear();
    }

    // тема
    function setupTheme() {
        const themeToggle = document.getElementById('theme-toggle');
        const themeIcon = document.getElementById('theme-icon');
        const body = document.body;
        const saved = localStorage.getItem('theme');
        if (saved === 'dark') {
            body.classList.add('dark-theme');
            themeIcon.className = 'fas fa-sun';
        }
        themeToggle.addEventListener('click', () => {
            body.classList.toggle('dark-theme');
            const isDark = body.classList.contains('dark-theme');
            themeIcon.className = isDark ? 'fas fa-sun' : 'fas fa-moon';
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
        });
    }

    // инициализация
    document.addEventListener('DOMContentLoaded', () => {
        setCurrentDate();
        setupTheme();
        
        // кнопки языка
        document.querySelectorAll('.lang-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                setLanguage(btn.dataset.lang);
            });
        });
        
        // кнопки вкладок
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                setTab(btn.dataset.tab);
            });
        });
        
        // начальный рендер
        renderContent();
        // синхронизация языка из localStorage (если есть)
        const savedLang = localStorage.getItem('preferredLanguage');
        if (savedLang && (savedLang === 'ru' || savedLang === 'en' || savedLang === 'zh')) {
            setLanguage(savedLang);
        } else {
            setLanguage('ru');
        }
        // сохраняем выбранный язык при переключении
        const originalSetLang = setLanguage;
        window.setLanguage = function(lang) {
            localStorage.setItem('preferredLanguage', lang);
            originalSetLang(lang);
        };
        setLanguage = function(lang) {
            localStorage.setItem('preferredLanguage', lang);
            originalSetLang(lang);
        }.bind(this);
        // подменяем для корректной работы
        document.querySelectorAll('.lang-btn').forEach(btn => {
            btn.removeEventListener('click', btn.click);
            btn.addEventListener('click', () => {
                const l = btn.dataset.lang;
                localStorage.setItem('preferredLanguage', l);
                setLanguage(l);
            });
        });
        // перевызов синхронизации
        if (savedLang) setLanguage(savedLang);
    });
</script>
