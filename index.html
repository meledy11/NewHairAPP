        }

            gap: 16px;
            margin-bottom: 20px;
        }

        .logo-icon {

            height: 64px;

            justify-content: center;

            background-clip: text;
            color: transparent;
            letter-spacing: -0.5px;

            color: #708A81;

            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 10px;

            justify-content: center;
            gap: 12px;
            margin: 25px 0 30px;
            flex-wrap: wrap;

            font-weight: 500;

            display: flex;
            align-items: center;

            color: #DD8E58;

            border-color: transparent;
            color: white;

            gap: 12px;
            margin-bottom: 30px;
            border-bottom: 2px solid #E5D1B8;
            padding-bottom: 5px;
            flex-wrap: wrap;

            border: none;

            font-size: 16px;
            font-weight: 600;
            color: #708A81;
            cursor: pointer;
            border-radius: 40px 40px 0 0;

            display: flex;
            align-items: center;
            gap: 10px;

    function renderContent() {
        const container = document.getElementById('doc-content');
        const data = content[currentLang];
        const docType = currentTab === 'privacy' ? data.privacy : data.eula;

        let html = `<div class="card">
            <h1 class="doc-title"><i class="${currentTab === 'privacy' ? 'fas fa-shield-alt' : 'fas fa-file-contract'}"></i> ${docType.title}</h1>`;

        for (const section of docType.sections) {
            html += `<div class="section">
                <h2><i class="fas ${currentTab === 'privacy' ? 'fa-lock' : 'fa-scale-balanced'}"></i> ${section.title}</h2>`;
            for (const line of section.content) {
                if (line.startsWith('•')) {
                    html += `<ul><li>${line.substring(2)}</li></ul>`;
                } else {
                    html += `<p>${line}</p>`;
                }
            }
            html += `</div>`;
        }

        html += `<div class="contact-block">
                    <h3><i class="fas fa-envelope"></i> ${currentLang === 'ru' ? 'Контакты для связи' : (currentLang === 'en' ? 'Contact Information' : '联系信息')}</h3>
                    <a href="mailto:meledy11@yandex.ru" class="contact-email"><i class="far fa-envelope"></i> meledy11@yandex.ru</a>
                </div>
            </div>`;

        container.innerHTML = html;
    }

    function updateUI() {
        document.getElementById('app-name').textContent = content[currentLang].appName;
        document.getElementById('footer-name').textContent = content[currentLang].appName;
        document.getElementById('tab-privacy-text').textContent = content[currentLang].privacyTab;
        document.getElementById('tab-eula-text').textContent = content[currentLang].eulaTab;
        document.getElementById('last-updated-text').textContent = content[currentLang].lastUpdated;
        document.getElementById('copyright-text').textContent = content[currentLang].copyright;
        document.getElementById('author-name').textContent = content[currentLang].author;
        renderContent();
    }

    function setLanguage(lang) {
        currentLang = lang;
        document.querySelectorAll('.lang-btn').forEach(btn => {
            btn.classList.toggle('active', btn.dataset.lang === lang);
        });
        updateUI();
        localStorage.setItem('preferredLanguage', lang);
    }

    function setTab(tab) {
        currentTab = tab;
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.classList.toggle('active', btn.dataset.tab === tab);
        });
        renderContent();
    }

    function setCurrentDate() {
        const now = new Date();
        const months = ['января', 'февраля', 'марта', 'апреля', 'мая', 'июня', 'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря'];
        document.getElementById('current-date').textContent = `${now.getDate()} ${months[now.getMonth()]} ${now.getFullYear()} г.`;
        document.getElementById('current-year').textContent = now.getFullYear();
    }

    function setupTheme() {
        const themeToggle = document.getElementById('theme-toggle');
        const themeIcon = document.getElementById('theme-icon');
        const saved = localStorage.getItem('theme');
        if (saved === 'dark') {
            document.body.classList.add('dark');
            themeIcon.className = 'fas fa-sun';
        }
        themeToggle.addEventListener('click', () => {
            document.body.classList.toggle('dark');
            const isDark = document.body.classList.contains('dark');
            themeIcon.className = isDark ? 'fas fa-sun' : 'fas fa-moon';
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
        });
    }

    document.addEventListener('DOMContentLoaded', () => {
        setCurrentDate();
        setupTheme();

        document.querySelectorAll('.lang-btn').forEach(btn => {
            btn.addEventListener('click', () => setLanguage(btn.dataset.lang));
        });

        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', () => setTab(btn.dataset.tab));
        });

        const savedLang = localStorage.getItem('preferredLanguage');
        if (savedLang && ['ru', 'en', 'zh'].includes(savedLang)) {
            setLanguage(savedLang);
        } else {
            setLanguage('ru');
        }
    });
</script>
