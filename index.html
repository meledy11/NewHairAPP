<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Мастер-колорист — Документы</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-color: #e8b4b4;
            --primary-dark: #c28b8b;
            --bg-color: #ffffff;
            --bg-color-dark: #1a1a1a;
            --card-bg: #fcf9f7;
            --card-bg-dark: #2a2a2a;
            --text-color: #2d2d2d;
            --text-color-dark: #f5f5f5;
            --text-light: #666666;
            --border-color: #f0e4e0;
            --border-color-dark: #404040;
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            --radius: 20px;
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.7;
            transition: all 0.3s ease;
            min-height: 100vh;
        }
        
        body.dark-theme {
            --bg-color: var(--bg-color-dark);
            --card-bg: var(--card-bg-dark);
            --text-color: var(--text-color-dark);
            --text-light: #bbbbbb;
            --border-color: var(--border-color-dark);
        }
        
        .container { max-width: 1000px; margin: 0 auto; padding: 20px; }
        .header { text-align: center; padding: 30px 0 20px; margin-bottom: 20px; }
        .logo { display: inline-flex; align-items: center; gap: 15px; margin-bottom: 15px; }
        .logo-icon {
            background: linear-gradient(135deg, var(--primary-color), var(--primary-dark));
            width: 60px; height: 60px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
        }
        .logo-icon i { font-size: 28px; color: white; }
        .logo-text {
            font-size: 32px; font-weight: 600;
            background: linear-gradient(135deg, var(--primary-dark), #a57878);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .last-updated { color: var(--text-light); font-size: 15px; display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 5px; }
        .language-switcher { display: flex; justify-content: center; gap: 15px; margin: 20px 0 25px; flex-wrap: wrap; }
        .lang-btn {
            background: var(--card-bg); border: 2px solid var(--border-color); border-radius: 50px;
            padding: 10px 25px; font-size: 15px; font-weight: 500; color: var(--text-color);
            cursor: pointer; transition: all 0.3s ease; display: flex; align-items: center; gap: 8px;
        }
        .lang-btn i { font-size: 16px; color: var(--primary-color); }
        .lang-btn:hover { border-color: var(--primary-color); transform: translateY(-2px); }
        .lang-btn.active {
            background: linear-gradient(135deg, var(--primary-color), var(--primary-dark));
            border-color: var(--primary-dark); color: white;
        }
        .lang-btn.active i { color: white; }
        
        .tabs {
            display: flex; gap: 10px; margin-bottom: 25px;
            border-bottom: 2px solid var(--border-color); padding-bottom: 5px; flex-wrap: wrap;
        }
        .tab-btn {
            background: transparent; border: none; padding: 12px 28px;
            font-size: 17px; font-weight: 600; color: var(--text-light);
            cursor: pointer; border-radius: 40px 40px 0 0;
            transition: all 0.2s ease; display: flex; align-items: center; gap: 10px;
        }
        .tab-btn i { font-size: 18px; }
        .tab-btn.active {
            color: var(--primary-dark); background: var(--card-bg);
            border-bottom: 3px solid var(--primary-dark);
        }
        .tab-btn:hover:not(.active) { color: var(--primary-color); background: rgba(232, 180, 180, 0.1); }
        
        .privacy-card {
            background: var(--card-bg); border-radius: var(--radius);
            padding: 40px; box-shadow: var(--shadow); border: 1px solid var(--border-color);
        }
        .doc-title {
            font-size: 28px; font-weight: 600; color: var(--primary-dark);
            margin-bottom: 20px; padding-bottom: 15px; border-bottom: 2px solid var(--border-color);
            display: flex; align-items: center; gap: 10px;
        }
        .doc-title i { font-size: 28px; }
        .section { margin-bottom: 35px; }
        .section h2 {
            font-size: 20px; font-weight: 600; margin-bottom: 15px;
            color: var(--text-color); display: flex; align-items: center; gap: 10px;
        }
        .section h2 i { color: var(--primary-color); font-size: 18px; }
        .section p { margin-bottom: 15px; font-size: 15px; color: var(--text-light); }
        .section ul, .section ol { margin: 10px 0 15px 25px; color: var(--text-light); }
        .section li { margin-bottom: 8px; font-size: 15px; }
        .highlight-box {
            background: rgba(232, 180, 180, 0.1); border-left: 4px solid var(--primary-color);
            padding: 20px; border-radius: 10px; margin: 20px 0;
        }
        .contact-block {
            background: linear-gradient(135deg, rgba(232, 180, 180, 0.1), rgba(194, 139, 139, 0.05));
            border-radius: 15px; padding: 25px; margin-top: 30px; text-align: center;
            border: 1px dashed var(--primary-color);
        }
        .contact-email {
            display: inline-block; background: white; padding: 12px 25px;
            border-radius: 50px; color: var(--primary-dark); font-weight: 500;
            margin-top: 15px; border: 1px solid var(--primary-color); box-shadow: 0 5px 15px rgba(0,0,0,0.05);
        }
        body.dark-theme .contact-email { background: var(--bg-color-dark); color: var(--primary-color); }
        .footer { text-align: center; padding: 30px 0 20px; margin-top: 30px; color: var(--text-light); font-size: 14px; border-top: 1px solid var(--border-color); }
        .theme-toggle {
            position: fixed; bottom: 25px; right: 25px; background: var(--card-bg);
            width: 50px; height: 50px; border-radius: 50%; display: flex; align-items: center;
            justify-content: center; cursor: pointer; box-shadow: var(--shadow);
            border: 1px solid var(--border-color); z-index: 100; transition: all 0.3s ease;
        }
        .theme-toggle:hover { transform: rotate(30deg); }
        .theme-toggle i { font-size: 20px; color: var(--text-color); }
        
        @media (max-width: 768px) {
            .privacy-card { padding: 25px; }
            .doc-title { font-size: 24px; }
            .logo-text { font-size: 26px; }
            .tab-btn { padding: 8px 18px; font-size: 14px; }
        }
        @media (max-width: 480px) {
            .container { padding: 15px; }
            .privacy-card { padding: 20px; }
        }
    </style>
</head>

    </div>

    <header class="header">
        <div class="logo">
            <div class="logo-icon"><i class="fas fa-palette"></i></div>
            <h1 class="logo-text" id="app-name">Мастер-колорист</h1>
        </div>

        <div class="language-switcher">
            <button class="lang-btn active" data-lang="ru"><i class="fas fa-language"></i> Русский</button>
            <button class="lang-btn" data-lang="en"><i class="fas fa-language"></i> English</button>
            <button class="lang-btn" data-lang="zh"><i class="fas fa-language"></i> 中文</button>
        </div>

        <div class="last-updated">
            <i class="far fa-calendar-alt"></i>
            <span id="last-updated-text">Дата последнего обновления:</span>
            <span id="current-date">19 февраля 2026 г.</span>
        </div>
    </header>

    <div class="tabs">
        <button class="tab-btn active" data-tab="privacy"><i class="fas fa-shield-alt"></i> <span id="tab-privacy-text">Политика конфиденциальности</span></button>
        <button class="tab-btn" data-tab="eula"><i class="fas fa-file-contract"></i> <span id="tab-eula-text">Лицензионное соглашение</span></button>
    </div>

    <div id="doc-content"></div>

    <footer class="footer">
        <p>© <span id="current-year">2026</span> <span id="footer-name">Мастер-колорист</span>. <span id="copyright-text">Все права защищены.</span></p>
        <p id="author-name">Чигракова Анастасия Сергеевна</p>
    </footer>
</div>

    function setLanguage(lang) {
        currentLang = lang;
        document.querySelectorAll('.lang-btn').forEach(btn => {
            btn.classList.toggle('active', btn.dataset.lang === lang);
        });
        updateUI();
        localStorage.setItem('preferredLanguage', lang);
    }
    
    function setTab(tab) {
        currentTab = tab;
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.classList.toggle('active', btn.dataset.tab === tab);
        });
        renderContent();
    }
